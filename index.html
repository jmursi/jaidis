px;padding-bottom:36px;display:flex;flex-direction:column;align-items:center;text-align:center\">\n<p style=\"font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#CFE3FB\">JAIDIS \u00b7 DRICE, Daystar University<\/p>\n<h2 class=\"ser\" style=\"font-size:40px;line-height:1.15;font-weight:700;margin-top:10px;color:#fff;max-width:900px\">Journal of Artificial Intelligence, Digital Innovation and Society<\/h2>\n<form aria-label=\"Search the journal\" class=\"srch\" style=\"display:flex;width:100%;max-width:700px;margin-top:28px\">\n<label for=\"bs\" style=\"position:absolute;left:-9999px\">Search JAIDIS<\/label>\n<input id=\"bs\" class=\"si\" type=\"search\" placeholder=\"Search JAIDIS\">\n<button type=\"button\" class=\"sb\" aria-label=\"Search\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M16.5 16.5L21 21\"><\/path><\/svg><\/button>\n<\/form>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:22px;justify-content:center\">\n<a class=\"bb bb1\" href=\"Author-Guidelines.html\">Submit manuscript<\/a>\n<a class=\"bb bb2\" href=\"Contact.html\">Announcements<\/a>\n<\/div>\n<\/div>\n<\/section>\n<div class=\"tabs\"><nav class=\"wrap\" aria-label=\"Journal sections\" style=\"display:flex;flex-wrap:wrap;padding-left:12px\"><a href=\"index.html\">Journal home<\/a><a href=\"About.html\" class=\"on\" aria-current=\"page\">Journal information<\/a><a href=\"Current-Issue.html\">Latest articles<\/a><a href=\"Archives.html\">All volumes<\/a><\/nav><\/div>\n<div class=\"gb\"><div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-top:28px;padding-bottom:48px\"><nav class=\"sd\" aria-label=\"Journal information\"><a href=\"About.html\" class=\"on\" aria-current=\"page\">About this journal<\/a><a href=\"Editorial-Board.html\" class=\"sub\">Editorial board<\/a><a href=\"Contact.html\" class=\"sub\">Contact details<\/a><a href=\"Author-Guidelines.html\">Author instructions<\/a><a href=\"Peer-Review.html\">Peer review information<\/a><div class=\"sh\" style=\"border-top:0\">Journal policies<\/div><a href=\"Publication-Ethics.html\" class=\"sub\">Publication ethics<\/a><a href=\"Open-Access.html\" class=\"sub\">Open access and copyright<\/a><\/nav><main class=\"ct\"><div style=\"padding-bottom:28px;border-bottom:1px solid #E3E8EF\"><h1 class=\"pt\">About JAIDIS<\/h1>\n<p style=\"font-size:19px;color:#2A3750;margin-top:16px;max-width:720px\">The Journal of Artificial Intelligence, Digital Innovation and Society publishes research that connects intelligent technologies, digital transformation and their effects on people and institutions.<\/p>\n<p style=\"margin-top:20px;font-size:14px;color:#44526A;max-width:720px\"><span class=\"ph\">Draft text for editorial board approval<\/span> The wording on this page proposes the journal\u2019s positioning and must be confirmed before launch.<\/p><\/div><div style=\"padding-top:8px\">\n\n<div style=\"flex:1 1 560px;min-width:0;max-width:760px\">\n<section id=\"aims\">\n<h2 class=\"ser\" style=\"font-size:32px;font-weight:700;line-height:1.2\">Aims<\/h2>\n<p style=\"font-size:17px;margin-top:16px;color:#1B2840\">JAIDIS aims to publish rigorous, peer-reviewed research on artificial intelligence, digital innovation and their societal consequences. It seeks work that is technically sound, clearly connected to real-world settings, and useful to readers beyond a single discipline.<\/p>\n<p style=\"font-size:17px;margin-top:16px;color:#1B2840\">The journal welcomes a global outlook and gives particular attention to research grounded in African contexts, where questions of language, infrastructure, inclusion and governance shape how technologies are built and used.<\/p>\n<\/section>\n\n<section id=\"scope\" style=\"margin-top:56px\">\n<h2 class=\"ser\" style=\"font-size:32px;font-weight:700;line-height:1.2\">Scope<\/h2>\n<p style=\"font-size:17px;margin-top:16px;color:#1B2840\">The journal\u2019s scope has three strands. A submission should engage clearly with the strands it claims, and should show why the work matters for the other communities the journal serves.<\/p>\n<div style=\"display:grid;gap:20px;margin-top:28px\">\n<div class=\"card\" style=\"border-left:5px solid #1B7FE3;padding:22px 24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700;color:#0D55AB\">Artificial Intelligence<\/h3><p style=\"margin-top:8px;color:#2A3750\">Machine learning, generative AI, intelligent systems, AI evaluation, responsible AI, AI safety and multilingual AI.<\/p><\/div>\n<div class=\"card\" style=\"border-left:5px solid #0B7A75;padding:22px 24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700;color:#075C58\">Digital Innovation<\/h3><p style=\"margin-top:8px;color:#2A3750\">Digital entrepreneurship, fintech, health technology, information systems, digital public infrastructure and technology commercialisation.<\/p><\/div>\n<div class=\"card\" style=\"border-left:5px solid #4B4FC4;padding:22px 24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700;color:#3A3DA0\">Society<\/h3><p style=\"margin-top:8px;color:#2A3750\">Technology governance, digital inclusion, human\u2013AI interaction, ethics, labour, education, public policy and societal impacts.<\/p><\/div>\n<\/div>\n<p style=\"font-size:17px;margin-top:24px;color:#1B2840\">Scope is deliberately focused. A paper that is simply about technology, without a clear fit to the journal\u2019s aims, is outside scope. Editors may decline such submissions before peer review.<\/p>\n<\/section>\n\n<section id=\"audience\" style=\"margin-top:56px\">\n<h2 class=\"ser\" style=\"font-size:32px;font-weight:700;line-height:1.2\">Audience<\/h2>\n<p style=\"font-size:17px;margin-top:16px;color:#1B2840\">JAIDIS is written for researchers in computing, information systems, business, health, education, law, public policy and the social sciences. It also serves practitioners, policymakers, innovators and postgraduate students who need evidence about how digital and intelligent technologies work in practice.<\/p>\n<\/section>\n\n<section id=\"distinctive\" style=\"margin-top:56px\">\n<h2 class=\"ser\" style=\"font-size:32px;font-weight:700;line-height:1.2\">Distinctive contribution<\/h2>\n<p style=\"font-size:17px;margin-top:16px;color:#1B2840\">Research on AI, on digital innovation and on society usually appears in separate venues. JAIDIS brings these communities into one conversation, so that technical advances, commercial deployment and public consequences can be examined together.<\/p>\n<p style=\"font-size:17px;margin-top:16px;color:#1B2840\">The journal combines an international, interdisciplinary reach with a commitment to evidence from real-world contexts, including Africa, and a clear editorial boundary that keeps every paper relevant to its scope.<\/p>\n<\/section>\n\n<section id=\"identity\" style=\"margin-top:56px\">\n<h2 class=\"ser\" style=\"font-size:32px;font-weight:700;line-height:1.2\">Journal details<\/h2>\n<p style=\"font-size:15px;margin-top:12px;color:#44526A\">Each item is shown only once it has been formally confirmed.<\/p>\n<dl style=\"margin:20px 0 0\">\n<div class=\"row\"><dt>Title<\/dt><dd>Journal of Artificial Intelligence, Digital Innovation and Society (JAIDIS)<\/dd><\/div>\n<div class=\"row\"><dt>Publisher<\/dt><dd>Daystar University<\/dd><\/div>\n<div class=\"row\"><dt>Editorial ownership<\/dt><dd>Directorate of Research, Innovation, Commercialisation and Entrepreneurship (DRICE)<\/dd><\/div>\n<div class=\"row\"><dt>Publication frequency<\/dt><dd><span class=\"ph\">[To be confirmed]<\/span><\/dd><\/div>\n<div class=\"row\"><dt>ISSN (online)<\/dt><dd><span class=\"ph\">[Pending application]<\/span><\/dd><\/div>\n<div class=\"row\"><dt>DOI registration<\/dt><dd><span class=\"ph\">[Registration plan to be confirmed]<\/span><\/dd><\/div>\n<div class=\"row\"><dt>Language<\/dt><dd><span class=\"ph\">[To be confirmed]<\/span><\/dd><\/div>\n<\/dl>\n<\/section>\n<\/div><\/div><\/main><\/div><\/div>\n<footer>\n<div class=\"ft1\">\n<div class=\"wrap\" style=\"padding-top:44px;padding-bottom:36px\">\n<div style=\"background:#fff;display:inline-block;padding:10px 16px;border-radius:4px\"><img src=\"@@LOGO@@\" alt=\"Daystar University \u2014 DRICE\" style=\"height:56px;width:auto;display:block\"><\/div>\n<p class=\"ser\" style=\"margin-top:22px;font-size:22px;font-weight:700;color:#fff;max-width:640px;line-height:1.25\">Journal of Artificial Intelligence, Digital Innovation and Society<\/p>\n<p style=\"margin-top:8px;font-size:15px;max-width:640px\">JAIDIS is published under the Directorate of Research, Innovation, Commercialisation and Entrepreneurship (DRICE), Daystar University. Proposed web address: aipajournal.com<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px 40px;margin-top:36px\">\n<div><h2>This journal<\/h2><a class=\"fk\" href=\"About.html\">About this journal<\/a><a class=\"fk\" href=\"Editorial-Board.html\">Editorial board<\/a><a class=\"fk\" href=\"Contact.html\">Contact details<\/a><\/div>\n<div><h2>Read<\/h2><a class=\"fk\" href=\"Current-Issue.html\">Latest articles<\/a><a class=\"fk\" href=\"Archives.html\">All volumes<\/a><\/div>\n<div><h2>Authors<\/h2><a class=\"fk\" href=\"Author-Guidelines.html\">Author instructions<\/a><a class=\"fk\" href=\"Peer-Review.html\">Peer review information<\/a><\/div>\n<div><h2>Journal policies<\/h2><a class=\"fk\" href=\"Publication-Ethics.html\">Publication ethics<\/a><a class=\"fk\" href=\"Open-Access.html\">Open access and copyright<\/a><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"ft2\">\n<div class=\"wrap\" style=\"padding-top:14px;padding-bottom:18px\">\n<nav aria-label=\"Legal\" style=\"display:flex;flex-wrap:wrap\"><a href=\"Open-Access.html\">Rights &amp; permissions<\/a><a href=\"Open-Access.html\">Copyright<\/a><a e-height:1.15;margin:0;color:#0F2A6B}\n.ft1{background:#0F2A6B;color:#C9D3E3}\n.ft1 h2{font-size:18px;font-weight:700;color:#fff;margin:0 0 12px}\n.ft1 a.fk{display:block;color:#fff;text-decoration:none;padding:9px 0;font-size:16px}\n.ft1 a.fk:hover{text-decoration:underline}\n.ft2{background:#101827;color:#fff}\n.ft2 a{color:#fff;text-decoration:none;font-size:15px;padding:6px 14px 6px 0;display:inline-block}\n.ft2 a:hover{text-decoration:underline}\nhtml,body{width:100%;min-height:100%}body{background:#fff}\n<\/style>\n\n<\/head>\n<body>\n\n\n<div style=\"font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A6B;background:#fff\">\n<div style=\"background:#fff;border-bottom:1px solid #E3E8EF\">\n<div class=\"wrap ut\">\n<a href=\"index.html\" style=\"display:inline-flex;align-items:center\"><img src=\"@@LOGO@@\" alt=\"Daystar University \u2014 Directorate of Research, Innovation, Commercialisation and Entrepreneurship (DRICE)\" style=\"height:58px;width:auto;display:block\"><\/a>\n<nav aria-label=\"Utility\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 12px\">\n<a class=\"ul\" href=\"Author-Guidelines.html\">For authors<\/a>\n<a class=\"ul\" href=\"Peer-Review.html\">Peer review<\/a>\n<a class=\"ul\" href=\"Contact.html\">Contact<\/a>\n<span style=\"font-weight:700;font-size:15px;color:#0F2A6B;padding:0 8px\">English<\/span>\n<\/nav>\n<\/div>\n<\/div>\n<div class=\"mn\">\n<div class=\"wrap\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 28px\">\n<a href=\"index.html\" style=\"display:inline-flex;align-items:center;gap:12px;min-height:60px\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 52 52\" aria-hidden=\"true\"><circle cx=\"26\" cy=\"26\" r=\"24\" fill=\"#0F2A6B\" stroke=\"#5BA4F0\" stroke-width=\"2\"><\/circle><circle cx=\"26\" cy=\"19\" r=\"9\" fill=\"#5BA4F0\" fill-opacity=\".55\"><\/circle><circle cx=\"20\" cy=\"29\" r=\"9\" fill=\"#2BB3AA\" fill-opacity=\".55\"><\/circle><circle cx=\"32\" cy=\"29\" r=\"9\" fill=\"#8F93F0\" fill-opacity=\".55\"><\/circle><\/svg>\n<span class=\"ser\" style=\"font-size:30px;font-weight:700;letter-spacing:.02em;color:#fff\">JAIDIS<\/span><\/a>\n<span aria-hidden=\"true\" style=\"width:1px;height:32px;background:#3F5A9E\"><\/span>\n<nav aria-label=\"Primary\" style=\"display:flex;flex-wrap:wrap;gap:0 16px\">\n<a class=\"ml\" href=\"About.html\">About the journal<\/a>\n<a class=\"ml\" href=\"Author-Guidelines.html\">For authors<\/a>\n<a class=\"ml\" href=\"Publication-Ethics.html\">Policies<\/a>\n<a class=\"ml\" href=\"Contact.html\">Contact<\/a>\n<\/nav>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px\">\n<div style=\"display:flex;align-items:center;gap:12px;color:#fff;font-size:15px;line-height:1.25\">\n<svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M3 9l9-5 9 5\"><\/path><path d=\"M5 10v8M9.5 10v8M14.5 10v8M19 10v8\"><\/path><path d=\"M3 20h18\"><\/path><\/svg>\n<span>Published under DRICE<br><strong>Daystar University<\/strong><\/span>\n<\/div>\n<a class=\"ml\" href=\"Archives.html\" style=\"gap:10px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M16.5 16.5L21 21\"><\/path><\/svg>Search<\/a>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wrap bc\"><a href=\"index.html\">Home<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> <a href=\"index.html\">JAIDIS<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> <a href=\"About.html\">Journal information<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> Author instructions<\/div>\n<section class=\"bn\">\n<svg viewBox=\"0 0 1240 330\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%\"><g fill=\"#fff\" fill-opacity=\".13\"><circle cx=\"40\" cy=\"40\" r=\"7\"><\/circle><circle cx=\"90\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"140\" cy=\"40\" r=\"9\"><\/circle><circle cx=\"60\" cy=\"120\" r=\"5\"><\/circle><circle cx=\"110\" cy=\"150\" r=\"8\"><\/circle><circle cx=\"30\" cy=\"200\" r=\"6\"><\/circle><circle cx=\"170\" cy=\"100\" r=\"5\"><\/circle><circle cx=\"220\" cy=\"60\" r=\"7\"><\/circle><circle cx=\"1160\" cy=\"50\" r=\"8\"><\/circle><circle cx=\"1100\" cy=\"90\" r=\"6\"><\/circle><circle cx=\"1200\" cy=\"120\" r=\"7\"><\/circle><circle cx=\"1130\" cy=\"170\" r=\"5\"><\/circle><circle cx=\"1060\" cy=\"40\" r=\"5\"><\/circle><circle cx=\"1180\" cy=\"210\" r=\"8\"><\/circle><circle cx=\"980\" cy=\"60\" r=\"6\"><\/circle><circle cx=\"1020\" cy=\"130\" r=\"5\"><\/circle><\/g><circle cx=\"620\" cy=\"400\" r=\"260\" fill=\"#fff\" fill-opacity=\".05\"><\/circle><\/svg>\n<div class=\"wrap\" style=\"position:relative;padding-top:44px;padding-bottom:36px;display:flex;flex-direction:column;align-items:center;text-align:center\">\n<p style=\"font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#CFE3FB\">JAIDIS \u00b7 DRICE, Daystar University<\/p>\n<h2 class=\"ser\" style=\"font-size:40px;line-height:1.15;font-weight:700;margin-top:10px;color:#fff;max-width:900px\">Journal of Artificial Intelligence, Digital Innovation and Society<\/h2>\n<form aria-label=\"Search the journal\" class=\"srch\" style=\"display:flex;width:100%;max-width:700px;margin-top:28px\">\n<label for=\"bs\" style=\"position:absolute;left:-9999px\">Search JAIDIS<\/label>\n<input id=\"bs\" class=\"si\" type=\"search\" placeholder=\"Search JAIDIS\">\n<button type=\"button\" class=\"sb\" aria-label=\"Search\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M16.5 16.5L21 21\"><\/path><\/svg><\/button>\n<\/form>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:22px;justify-content:center\">\n<a class=\"bb bb1\" href=\"Author-Guidelines.html\">Submit manuscript<\/a>\n<a class=\"bb bb2\" href=\"Contact.html\">Announcements<\/a>\n<\/div>\n<\/div>\n<\/section>\n<div class=\"tabs\"><nav class=\"wrap\" aria-label=\"Journal sections\" style=\"display:flex;flex-wrap:wrap;padding-left:12px\"><a href=\"index.html\">Journal home<\/a><a href=\"About.html\" class=\"on\" aria-current=\"page\">Journal information<\/a><a href=\"Current-Issue.html\">Latest articles<\/a><a href=\"Archives.html\">All volumes<\/a><\/nav><\/div>\n<div class=\"gb\"><div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-top:28px;padding-bottom:48px\"><nav class=\"sd\" aria-label=\"Journal information\"><a href=\"About.html\">About this journal<\/a><a href=\"Editorial-Board.html\" class=\"sub\">Editorial board<\/a><a href=\"Contact.html\" class=\"sub\">Contact details<\/a><a href=\"Author-Guidelines.html\" class=\"on\" aria-current=\"page\">Author instructions<\/a><a href=\"Peer-Review.html\">Peer review information<\/a><div class=\"sh\" style=\"border-top:0\">Journal policies<\/div><a href=\"Publication-Ethics.html\" class=\"sub\">Publication ethics<\/a><a href=\"Open-Access.html\" class=\"sub\">Open access and copyright<\/a><\/nav><main class=\"ct\"><div style=\"padding-bottom:28px;border-bottom:1px solid #E3E8EF\"><h1 class=\"pt\">Author Guidelines<\/h1>\n<p style=\"font-size:19px;color:#2A3750;margin-top:16px;max-width:720px\">Everything you need to prepare and submit a manuscript to JAIDIS.<\/p>\n<p style=\"margin-top:20px;font-size:14px;color:#44526A;max-width:720px\"><span class=\"ph\">Draft for editorial approval<\/span> Requirements marked as placeholders will be set by the editorial board. Nothing on this page states a fee or a review timeline.<\/p>\n<div style=\"margin-top:28px\"><a class=\"btn btn-p\" href=\"#submit\">Go to submission<\/a><\/div><\/div><div style=\"padding-top:8px\">\n\n<div style=\"flex:1 1 560px;min-width:0;max-width:780px\">\n\n<section id=\"before\" class=\"sec\" style=\"margin-top:32px\">\n<h2>Before you submit<\/h2>\n<p class=\"lead\">Check that your work fits the journal\u2019s scope: it should engage with artificial intelligence, digital innovation or society, and show why it matters in a real-world context. Read the <a href=\"About.html#scope\">scope statement<\/a>.<\/p>\n<p class=\"lead\">Submissions must be original, must not be under consideration elsewhere, and must follow the journal\u2019s <a href=\"Publication-Ethics.html\">publication ethics<\/a>. Read the <a href=\"Open-Access.html\">open access and copyright<\/a> page for licensing, and the <a href=\"Peer-Review.html\">peer review<\/a> page for how decisions are made.<\/p>\n<\/section>\n\n<section id=\"types\" class=\"sec\">\n<h2>Article types<\/h2>\n<p class=\"lead\">Proposed types, for approval by the editorial board. Length limits will be added once set.<\/p>\n<div style=\"margin-top:20px;border-top:1px solid #D8DDE6\">\n<div class=\"tr\"><div class=\"a\">Research article<\/div><div class=\"b\">Original empirical, computational or theoretical research.<\/div><div class=\"c\"><span class=\"ph\">[Length limit]<\/span><\/div><\/div>\n<div class=\"tr\"><div class=\"a\">Review article<\/div><div class=\"b\">Systematic or critical synthesis of existing research.<\/div><div class=\"c\"><span class=\"ph\">[Length limit]<\/span><\/div><\/div>\n<div class=\"tr\"><div class=\"a\">Case study<\/div><div class=\"b\">In-depth account of a deployment, programme or institution, with clear lessons.<\/div><div class=\"c\"><span class=\"ph\">[Length limit]<\/span><\/div><\/div>\n<div class=\"tr\"><div class=\"a\">Policy and practice paper<\/div><div class=\"b\">Evidence-based analysis for policymakers and practitioners.<\/div><div class=\"c\"><span class=\"ph\">[Length limit]<\/span><\/div><\/div>\n<div class=\"tr\"><div class=\"a\">Commentary<\/div><div class=\"b\">Short, argued perspective on a current issue within scope.<\/div><div class=\"c\"><span class=\"ph\">[Length limit]<\/span><\/div><\/div>\n<\/div>\n<\/section>\n\n<section id=\"prepare\" class=\"sec\">\n<h2>Preparing your manuscript<\/h2>\n<p class=\"lead\">Open each item for what the journal will ask of you.<\/p>\n<details class=\"q\" open=\"\"><summary>Title page and author information<\/summary><div>Title, all authors with affiliations and ORCID iDs, a corresponding author with email, and a statement of each author\u2019s contribution. Authors are listed only with their agreement.<\/div><\/details>\n<details class=\"q\"><summary>Abstract and keywords<\/summary><div>A self-contained abstract that states the problem, method, findings and significance, followed by keywords. <span class=\"ph\">[Abstract length \u2014 to be set]<\/span><\/div><\/details>\n<details class=\"q\"><summary>Structure and formatting<\/summary><div>Clear headings, numbered figures and tables with captions, and accessible alt text for images. <span class=\"ph\">[Manuscript template and file format \u2014 to be set]<\/span><\/div><\/details>\n<details class=\"q\"><summary>References<\/summary><div>Every cited work appears in the reference list, with DOIs where available. <span class=\"ph\">[Citation style \u2014 to be selected]<\/span><\/div><\/details>\n<details class=\"q\"><summary>Data, code and materials<\/summary><div>A statement saying where the data and code behind the findings can be found, or why they cannot be shared.<\/div><\/details>\n<details class=\"q\"><summary>Ethics, funding and conflicts of interest<\/summary><div>Ethics approval and consent for research involving people, funding sources, and any competing interests. Details are on the <a href=\"Publication-Ethics.html\">publication ethics<\/a> page.<\/div><\/details>\n<details class=\"q\"><summary>Use of generative AI tools<\/summary><div>Authors disclose any use of generative AI in preparing the manuscript. <span class=\"ph\">[Policy wording \u2014 to be approved]<\/span><\/div><\/details>\n<\/section>\n\n<section id=\"checklist\" class=\"sec\">\n<h2>Submission checklist<\/h2>\n<div style=\"margin-top:16px\">\n<div class=\"ck\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#0B6B66\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M7.5 12.5l3 3 6-7\"><\/path><\/svg><span>The work is original and not under review elsewhere.<\/span><\/div>\n<div class=\"ck\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#0B6B66\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M7.5 12.5l3 3 6-7\"><\/path><\/svg><span>The topic clearly fits the journal\u2019s scope.<\/span><\/div>\n<div class=\"ck\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#0B6B66\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M7.5 12.5l3 3 6-7\"><\/path><\/svg><span>All authors, affiliations and contributions are listed and agreed.<\/span><\/div>\n<div class=\"ck\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#0B6B66\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M7.5 12.5l3 3 6-7\"><\/path><\/svg><span>Abstract, keywords and references are complete.<\/span><\/div>\n<div class=\"ck\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#0B6B66\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M7.5 12.5l3 3 6-7\"><\/path><\/svg><span>Ethics approval, funding, conflicts of interest and data availability are stated.<\/span><\/div>\n<div class=\"ck\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#0B6B66\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M7.5 12.5l3 3 6-7\"><\/path><\/svg><span>Any use of generative AI tools is disclosed.<\/span><\/div>\n<\/div>\n<\/section>\n\n<section id=\"process\" class=\"sec\">\n<h2>What happens next<\/h2>\n<div style=\"margin-top:12px\">\n<div class=\"st\"><div class=\"n\" aria-hidden=\"true\">1<\/div><div><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Editorial screening<\/h3><p style=\"color:#2A3750\">The editorial office and a section editor check scope, completeness and originality.<\/p><\/div><\/div>\n<div class=\"st\"><div class=\"n\" aria-hidden=\"true\">2<\/div><div><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Peer review<\/h3><p style=\"color:#2A3750\">Suitable manuscripts go to independent reviewers. See <a href=\"Peer-Review.html\">Peer Review<\/a>.<\/p><\/div><\/div>\n<div class=\"st\"><div class=\"n\" aria-hidden=\"true\">3<\/div><div><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Decision<\/h3><p style=\"color:#2A3750\">You receive the editor\u2019s decision with reviewer comments.<\/p><\/div><\/div>\n<div class=\"st\"><div class=\"n\" aria-hidden=\"true\">4<\/div><div><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Production and publication<\/h3><p style=\"color:#2A3750\">Accepted papers are copyedited, assigned identifiers and published online.<\/p><\/div><\/div>\n<\/div>\n<p style=\"margin-top:12px;font-size:15px;color:#44526A\">Review timelines: <span class=\"ph\">[to be published once confirmed by the editorial office]<\/span><\/p>\n<\/section>\n\n<section id=\"submit\" class=\"sec\" style=\"background:#0F2A6B;color:#fff;border-radius:6px;padding:36px\">\n<h2 style=\"font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:700\">Submit your manuscript<\/h2>\n<p style=\"margin-top:12px;color:#C9D3E3;font-size:17px\">Manuscripts are submitted through the journal\u2019s online system.<\/p>\n<p style=\"margin-top:16px\"><span class=\"ph\">[Submission portal link \u2014 to be added]<\/span><\/p>\n<p style=\"margin-top:16px;font-size:15px;color:#C9D3E3\">Fees: see <a href=\"Open-Access.html\" style=\"color:#8EC3F5\">Open Access and Copyright<\/a>. Questions: <a href=\"Contact.html\" style=\"color:#8EC3F5\">contact the editorial office<\/a>.<\/p>\n<\/section>\n<\/div><\/div><\/main><\/div><\/div>\n<footer>\n<div class=\"ft1\">\n<div class=\"wrap\" style=\"padding-top:44px;padding-bottom:36px\">\n<div style=\"background:#fff;display:inline-block;padding:10px 16px;border-radius:4px\"><img src=\"@@LOGO@@\" alt=\"Daystar University \u2014 DRICE\" style=\"height:56px;width:auto;display:block\"><\/div>\n<p class=\"ser\" style=\"margin-top:22px;font-size:22px;font-weight:700;color:#fff;max-width:640px;line-height:1.25\">Journal of Artificial Intelligence, Digital Innovation and Society<\/p>\n<p style=\"margin-top:8px;font-size:15px;max-width:640px\">JAIDIS is published under the Directorate of Research, Innovation, Commercialisation and Entrepreneurship (DRICE), Daystar University. Proposed web address: aipajournal.com<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px 40px;margin-top:36px\">\n<div><h2>This journal<\/h2><a class=\"fk\" href=\"About.html\">About this journal<\/a><a class=\"fk\" href=\"Editorial-Board.html\">Editorial board<\/a><a class=\"fk\" href=\"Contact.html\">Contact details<\/a><\/div>\n<div><h2>Read<\/h2><a class=\"fk\" href=\"Current-Issue.html\">Latest articles<\/a><a class=\"fk\" href=\"Archives.html\">All volumes<\/a><\/div>\n<div><h2>Authors<\/h2><a class=\"fk\" href=\"Author-Guidelines.html\">Author instructions<\/a><a class=\"fk\" href=\"Peer-Review.html\">Peer review information<\/a><\/div>\n<div><h2>Journal policies<\/h2><a class=\"fk\" href=\"Publication-Ethics.html\">Publication ethics<\/a><a class=\"fk\" href=\"Open-Access.html\">Open access and copyright<\/a><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"ft2\">\n<div class=\"wrap\" style=\"padding-top:14px;padding-bottom:18px\">\n<nav aria-label=\" e quality of what is published.<\/p>\n<p style=\"margin-top:20px;font-size:14px;color:#44526A;max-width:720px\"><span class=\"ph\">Names pending permission<\/span> Editors are listed only with their written consent. Each profile shows name, affiliation, expertise and responsibilities.<\/p><\/div><div style=\"padding-top:8px\"><section>\n<h2 class=\"ser\" style=\"font-size:30px;font-weight:700\">Roles and responsibilities<\/h2>\n<p style=\"margin-top:12px;color:#44526A;max-width:720px\">Proposed role descriptions, subject to approval by the owning unit.<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:28px\">\n<div class=\"card\" style=\"padding:22px\"><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Editor-in-Chief<\/h3><p style=\"margin-top:8px;font-size:15px;color:#2A3750\">Leads the journal, sets editorial policy, and takes final responsibility for decisions on manuscripts.<\/p><\/div>\n<div class=\"card\" style=\"padding:22px\"><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Section Editors<\/h3><p style=\"margin-top:8px;font-size:15px;color:#2A3750\">Screen submissions in their area, invite reviewers and recommend decisions.<\/p><\/div>\n<div class=\"card\" style=\"padding:22px\"><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Advisory Board<\/h3><p style=\"margin-top:8px;font-size:15px;color:#2A3750\">Advises on scope, strategy and community engagement. Does not decide on individual manuscripts.<\/p><\/div>\n<div class=\"card\" style=\"padding:22px\"><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Editorial Office<\/h3><p style=\"margin-top:8px;font-size:15px;color:#2A3750\">Manages the submission system, author and reviewer communication, and production.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section style=\"margin-top:72px\">\n<h2 class=\"ser\" style=\"font-size:30px;font-weight:700\">Editor-in-Chief<\/h2>\n<div style=\"display:grid;grid-template-columns:rep iv>\n<\/div>\n<\/section>\n\n<section class=\"sec\">\n<h2>What this page will explain<\/h2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:24px\">\n<div class=\"card\" style=\"padding:24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700\">Open access<\/h3><p style=\"margin-top:8px;color:#2A3750\">Whether articles are free to read and download, and from when.<\/p><\/div>\n<div class=\"card\" style=\"padding:24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700\">Licensing<\/h3><p style=\"margin-top:8px;color:#2A3750\">The exact licence on each article and what readers may do with it, including sharing and adaptation.<\/p><\/div>\n<div class=\"card\" style=\"padding:24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700\">Copyright<\/h3><p style=\"margin-top:8px;color:#2A3750\">Who holds copyright, and the rights authors keep, such as reusing their own work.<\/p><\/div>\n<div class=\"card\" style=\"padding:24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700\">Fees and waivers<\/h3><p style=\"margin-top:8px;color:#2A3750\">Any charge to authors, when it applies and how waivers are decided. Stated before submission, never after acceptance.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\" style=\"background:#EAF3FD;border:1px solid #E3E8EF;border-radius:6px;padding:32px\">\n<h2>For the decision makers<\/h2>\n<p class=\"lead\" style=\"max-width:none\">Not part of the public site. Choices to settle before launch:<\/p>\n<p style=\"margin-top:12px;color:#2A3750\">Open-access model; licence (for example, a Creative Commons licence); copyright arrangement; whether any fee will be charged and who funds the journal; waiver criteria. Each answer replaces a placeholder above.<\/p>\n<\/section><\/div><\/main><\/div><\/div>\n<footer>\n<div class=\"ft1\">\n<div class=\"wrap\" style=\"padding-top:44px;padding-bottom:36px\">\n<div style=\"background:#fff;display:inline-block;pa  only once formally confirmed.<\/p>\n<\/div>\n<\/div>\n<\/footer>\n<\/div>\n\n\n<\/body>\n<\/html>\n", "Peer-Review": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>JAIDIS \u2014 Peer Review<\/title>\n\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A6B;background:#fff;line-height:1.55}\nh1,h2,h3,h4,p{margin:0}\na{color:#1565C0}a:hover{color:#0F2A6B}\n.wrap{max-width:1120px;margin:0 auto;padding:0 24px;box-sizing:border-box}\n.ser{font-family:'Source Serif 4',Georgia,serif}\n.nav a,.nav2 a{color:#0F2A6B;text-decoration:none;font-weight:500;font-size:15px;padding:12px 2px;border-bottom:3px solid transparent;display:inline-block;line-height:20px}\n.nav2 a{font-size:14px;color:#2A3750;padding:10px 2px}\n.nav a:hover,.nav2 a:hover{border-bottom-color:#1B7FE3;color:#0F2A6B}\n.nav a.on,.nav2 a.on{border-bottom-color:#1B7FE3;color:#0F2A6B}\n.ph{background:#FFF4D6;border:1px dashed #9A5217;color:#5C3410;padding:1px 7px;border-radius:3px;font-size:.92em}\n.card{border:1px solid #D8DDE6;border-radius:6px;background:#fff;box-sizing:border-box}\n.fh{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9FB2CE;font-weight:600;margin-bottom:8px}\n.fl{display:block;color:#C9D3E3;text-decoration:none;padding:6px 0;font-size:15px}\n.fl:hover{color:#fff;text-decoration:underline}\n.sec{margin-top:64px}\n.sec h2{font-family:'Source Serif 4',Georgia,serif;font-size:30px;font-weight:700;line-height:1.2}\n.sec p.lead{font-size:17px;margin-top:14px;color:#1B2840;max-width:760px}\n.stg{padding:22px;position:relative}\n.stg .n{width:34px;height:34px;border-radius:50%;background:#0F2A6B;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:12p <\/a>\n<nav aria-label=\"Utility\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 12px\">\n<a class=\"ul\" href=\"Author-Guidelines.html\">For authors<\/a>\n<a class=\"ul\" href=\"Peer-Review.html\">Peer review<\/a>\n<a class=\"ul\" href=\"Contact.html\">Contact<\/a>\n<span style=\"font-weight:700;font-size:15px;color:#0F2A6B;padding:0 8px\">English<\/span>\n<\/nav>\n<\/div>\n<\/div>\n<div class=\"mn\">\n<div class=\"wrap\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:0 28px\">\n<a href=\"index.html\" style=\"display:inline-flex;align-items:center;gap:12px;min-height:60px\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 52 52\" aria-hidden=\"true\"><circle cx=\"26\" cy=\"26\" r=\"24\" fill=\"#0F2A6B\" stroke=\"#5BA4F0\" stroke-width=\"2\"><\/circle><circle cx=\"26\" cy=\"19\" r=\"9\" fill=\"#5BA4F0\" fill-opacity=\".55\"><\/circle><circle cx=\"20\" cy=\"29\" r=\"9\" fill=\"#2BB3AA\" fill-opacity=\".55\"><\/circle><circle cx=\"32\" cy=\"29\" r=\"9\" fill=\"#8F93F0\" fill-opacity=\".55\"><\/circle><\/svg>\n<span class=\"ser\" style=\"font-size:30px;font-weight:700;letter-spacing:.02em;color:#fff\">JAIDIS<\/span><\/a>\n<span aria-hidden=\"true\" style=\"width:1px;height:32px;background:#3F5A9E\"><\/span>\n<nav aria-label=\"Primary\" style=\"display:flex;flex-wrap:wrap;gap:0 16px\">\n<a class=\"ml\" href=\"About.html\">About the journal<\/a>\n<a class=\"ml\" href=\"Author-Guidelines.html\">For authors<\/a>\n<a class=\"ml\" href=\"Publication-Ethics.html\">Policies<\/a>\n<a class=\"ml\" href=\"Contact.html\">Contact<\/a>\n<\/nav>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px\">\n<div style=\"display:flex;align-items:center;gap:12px;color:#fff;font-size:15px;line-height:1.25\">\n<svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M3 9l9-5 9 5\"><\/path><path d=\"M5 10v8M9.5 10v8M14.5 10v8M19 10v8\"><\/path><path d=\"M3 20h18\"><\/path><\/svg>\n<span>Published under DRICE<br><strong>Daystar University<\/strong><\/span>\n<\/div>\n<a class=\"ml\" href=\"Archives.html\" style=\"gap:10px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M16.5 16.5L21 21\"><\/path><\/svg>Search<\/a>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wrap bc\"><a href=\"index.html\">Home<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> <a href=\"index.html\">JAIDIS<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> <a href=\"About.html\">Journal information<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> Peer review information<\/div>\n<section class=\"bn\">\n<svg viewBox=\"0 0 1240 330\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%\"><g fill=\"#fff\" fill-opacity=\".13\"><circle cx=\"40\" cy=\"40\" r=\"7\"><\/circle><circle cx=\"90\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"140\" cy=\"40\" r=\"9\"><\/circle><circle cx=\"60\" cy=\"120\" r=\"5\"><\/circle><circle cx=\"110\" cy=\"150\" r=\"8\"><\/circle><circle cx=\"30\" cy=\"200\" r=\"6\"><\/circle><circle cx=\"170\" cy=\"100\" r=\"5\"><\/circle><circle cx=\"220\" cy=\"60\" r=\"7\"><\/circle><circle cx=\"1160\" cy=\"50\" r=\"8\"><\/circle><circle cx=\"1100\" cy=\"90\" r=\"6\"><\/circle><circle cx=\"1200\" cy=\"120\" r=\"7\"><\/circle><circle cx=\"1130\" cy=\"170\" r=\"5\"><\/circle><circle cx=\"1060\" cy=\"40\" r=\"5\"><\/circle><circle cx=\"1180\" cy=\"210\" r=\"8\"><\/circle><circle cx=\"980\" cy=\"60\" r=\"6\"><\/circle><circle cx=\"1020\" cy=\"130\" r=\"5\"><\/circle><\/g><circle cx=\"620\" cy=\"400\" r=\"260\" fill=\"#fff\" fill-opacity=\".05\"><\/circle><\/svg>\n<div class=\"wrap\" style=\"position:relative;padding-top:44px;padding-bottom:36px;display:flex;flex-direction:column;align-items:center;text-align:center\">\n<p style=\"font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#CFE3FB\">JAIDIS \u00b7 DRICE, Daystar University<\/p>\n<h2 class=\"ser\" style=\"font-size:40px;line-height:1.15;font-weight:700;margin-top:10px;color:#fff;max-width:900px\">Journal of Artificial Intelligence, Digital Innovation and Society<\/h2>\n<form aria-label=\"Search the journal\" class=\"srch\" style=\"display:flex;width:100%;max-width:700px;margin-top:28px\">\n<label for=\"bs\" style=\"position:absolute;left:-9999px\">Search JAIDIS<\/label>\n<input id=\"bs\" class=\"si\" type=\"search\" placeholder=\"Search JAIDIS\">\n<button type=\"button\" class=\"sb\" aria-label=\"Search\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M16.5 16.5L21 21\"><\/path><\/svg><\/button>\n<\/form>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:22px;justify-content:center\">\n<a class=\"bb bb1\" href=\"Author-Guidelines.html\">Submit manuscript<\/a>\n<a class=\"bb bb2\" href=\"Contact.html\">Announcements<\/a>\n<\/div>\n<\/div>\n<\/section>\n<div class=\"tabs\"><nav class=\"wrap\" aria-label=\"Journal sections\" style=\"display:flex;flex-wrap:wrap;padding-left:12px\"><a href=\"index.html\">Journal home<\/a><a href=\"About.html\" class=\"on\" aria-current=\"page\">Journal information<\/a><a href=\"Current-Issue.html\">Latest articles<\/a><a href=\"Archives.html\">All volumes<\/a><\/nav><\/div>\n<div class=\"gb\"><div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-top:28px;padding-bottom:48px\"><nav class=\"sd\" aria-label=\"Journal information\"><a href=\"About.html\">About this journal<\/a><a href=\"Editorial-Board.html\" class=\"sub\">Editorial board<\/a><a href=\"Contact.html\" class=\"sub\">Contact details<\/a><a href=\"Author-Guidelines.html\">Author instructions<\/a><a href=\"Peer-Review.html\" class=\"on\" aria-current=\"page\">Peer review information<\/a><div class=\"sh\" style=\"border-top:0\">Journal policies<\/div><a href=\"Publication-Ethics.html\" class=\"sub\">Publication ethics<\/a><a href=\"Open-Access.html\" class=\"sub\">Open access and copyright<\/a><\/nav><main class=\"ct\"><div style=\"padding-bottom:28px;border-bottom:1px solid #E3E8EF\"><h1 class=\"pt\">Peer Review<\/h1>\n<p style=\"font-size:19px;color:#2A3750;margin-top:16px;max-width:720px\">How a manuscript moves from submission to a decision, and who is responsible at each step.<\/p>\n<p style=\"margin-top:20px;font-size:14px;color:#44526A;max-width:720px\"><span class=\"ph\">Policy status: draft, not yet approved<\/span> The stages below describe a proposed process. Review model and timelines are left open on purpose.<\/p><\/div><div style=\"padding-top:8px\"><section class=\"sec\">\n<h2>Review model<\/h2>\n<p class=\"lead\">All research articles are assessed by independent experts before a decision is made.<\/p>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px 40px;margin-top:24px\">\n<div style=\"flex:1 1 280px\"><p style=\"font-size:13px;color:#44526A\">Anonymity model<\/p><p style=\"font-weight:600;margin-top:2px\"><span class=\"ph\">[To be confirmed by the editorial board]<\/span><\/p><\/div>\n<div style=\"flex:1 1 280px\"><p style=\"font-size:13px;color:#44526A\">Number of reviewers per manuscript<\/p><p style=\"font-weight:600;margin-top:2px\"><span class=\"ph\">[To be confirmed]<\/span><\/p><\/div>\n<div style=\"flex:1 1 280px\"><p style=\"font-size:13px;color:#44526A\">Typical time to first decision<\/p><p style=\"font-weight:600;margin-top:2px\"><span class=\"ph\">[Published only once confirmed]<\/span><\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\">\n<h2>The process<\/h2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:28px\">\n<div class=\"card stg\"><div class=\"n\" aria-hidden=\"true\">1<\/div><h3>Submission<\/h3><p>The author submits through the online system with all required files and statements.<\/p><\/div>\n<div class=\"card stg\"><div class=\"n\" aria-hidden=\"true\">2<\/div><h3>Editorial screening<\/h3><p>The editorial office checks completeness; a section editor checks scope, originality and basic quality.<\/p><\/div>\n<div class=\"card stg\"><div class=\"n\" aria-hidden=\"true\">3<\/div><h3>Reviewer assignment<\/h3><p>The editor invites qualified reviewers who declare any conflicts of interest.<\/p><\/div>\n<div class=\"card stg\"><div class=\"n\" aria-hidden=\"true\">4<\/div><h3>Peer review<\/h3><p>Reviewers assess the work and recommend a decision with written comments.<\/p><\/div>\n<div class=\"card stg\"><div class=\"n\" aria-hidden=\"true\">5<\/div><h3>Decision<\/h3><p>The editor weighs the reviews and communicates the decision to the author.<\/p><\/div>\n<div class=\"card stg\"><div class=\"n\" aria-hidden=\"true\">6<\/div><h3>Revision<\/h3><p>Authors respond point by point. Revised papers may return to reviewers.<\/p><\/div>\n<div class=\"card stg\"><div class=\"n\" aria-hidden=\"true\">7<\/div><h3>Acceptance and production<\/h3><p>Accepted work is copyedited, assigned identifiers and published.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\">\n<h2>Possible decisions<\/h2>\n<p class=\"lead\">Proposed decision categories.<\/p>\n<div style=\"margin-top:16px;border-top:1px solid #E3E8EF;max-width:760px\">\n<div class=\"dec\"><div class=\"d\" style=\"background:#0B7A75\"><\/div><div><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Accept<\/h3><p style=\"color:#2A3750\">The manuscript is suitable for publication, subject to production checks.<\/p><\/div><\/div>\n<div class=\"dec\"><div class=\"d\" style=\"background:#1B7FE3\"><\/div><div><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Minor revision<\/h3><p style=\"color:#2A3750\">Small changes are needed. The editor checks the revision.<\/p><\/div><\/div>\n<div class=\"dec\"><div class=\"d\" style=\"background:#4B4FC4\"><\/div><div><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Major revision<\/h3><p style=\"color:#2A3750\">Substantial changes are needed. The revised paper is normally re-reviewed.<\/p><\/div><\/div>\n<div class=\"dec\"><div class=\"d\" style=\"background:#9A5217\"><\/div><div><h3 class=\"ser\" style=\"font-size:19px;font-weight:700\">Reject<\/h3><p style=\"color:#2A3750\">The manuscript does not meet the journal\u2019s standards or scope. A paper may also be declined at screening, before external review.<\/p><\/div><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\">\n<h2>Responsibilities<\/h2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:24px\">\n<div class=\"card\" style=\"padding:24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700\">Editors<\/h3><p style=\"margin-top:8px;color:#2A3750\">Judge manuscripts on merit and scope, without regard to the authors\u2019 identity, nationality, institution or beliefs. Manage conflicts of interest and keep submissions confidential.<\/p><\/div>\n<div class=\"card\" style=\"padding:24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700\">Reviewers<\/h3><p style=\"margin-top:8px;color:#2A3750\">Give constructive, evidence-based and courteous feedback, declare conflicts, keep manuscripts confidential and not reuse unpublished material.<\/p><\/div>\n<div class=\"card\" style=\"padding:24px\"><h3 class=\"ser\" style=\"font-size:21px;font-weight:700\">Authors<\/h3><p style=\"margin-top:8px;color:#2A3750\">Respond fully and honestly to reviews, correct errors, and follow the <a href=\"Publication-Ethics.html\">publication ethics<\/a> policies.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\" style=\"display:flex;flex-wrap:wrap;gap:24px 56px\">\n<div style=\"flex:1 1 340px\">\n<h2>Appeals and complaints<\/h2>\n<p class=\"lead\">Authors who believe a decision was reached unfairly can ask the Editor-in-Chief to reconsider. <span class=\"ph\">[Appeals procedure \u2014 to be approved]<\/span><\/p>\n<\/div>\n<div style=\"flex:1 1 340px\">\n<h2>Becoming a reviewer<\/h2>\n<p class=\"lead\">Researchers with relevant expertise can offer to review. Contact the <a href=\"Contact.html\">editorial office<\/a>. <span class=\"ph\">[Reviewer recognition \u2014 to be decided]<\/span><\/p>\n<\/div>\n<\/section><\/div><\/main><\/div><\/div>\n<footer>\n<div class=\"ft1\">\n<div class=\"wrap\" style=\"padding-top:44px;padding-bottom:36px\">\n<div style=\"background:#fff;display:inline-block;padding:10px 16px;border-radius:4px\"><img src=\"@@LOGO@@\" alt=\"Daystar University \u2014 DRICE\" style=\"height:56px;width:auto;display:block\"><\/div>\n<p class=\"ser\" style=\"margin-top:22px;font-size:22px;font-weight:700;color:#fff;max-width:640px;line-height:1.25\">Journal of Artificial Intelligence, Digital Innovation and Society<\/p>\n<p style=\"margin-top:8px;font-size:15px;max-width:640px\">JAIDIS is published under the Directorate of Research, Innovation, Commercialisation and Entrepreneurship (DRICE), Daystar University. Proposed web address: aipajournal.com<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px 40px;margin-top:36px\">\n<div><h2>This journal<\/h2><a class=\"fk\" href=\"About.html\">About this journal<\/a><a class=\"fk\" href=\"Editorial-Board.html\">Editorial board<\/a><a class=\"fk\" href=\"Contact.html\">Contact details<\/a><\/div>\n<div><h2>Read<\/h2><a class=\"fk\" href=\"Current-Issue.html\">Latest articles<\/a><a class=\"fk\" href=\"Archives.html\">All volumes<\/a><\/div>\n<div><h2>Authors<\/h2><a class=\"fk\" href=\"Author-Guidelines.html\">Author instructions<\/a><a class=\"fk\" href=\"Peer-Review.html\">Peer review information<\/a><\/div>\n<div><h2>Journal policies<\/h2><a class=\"fk\" href=\"Publication-Ethics.html\">Publication ethics<\/a><a class=\"fk\" href=\"Open-Access.html\">Open access and copyright<\/a><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"ft2\">\n<div class=\"wrap\" style=\"padding-top:14px;padding-bottom:18px\">\n<nav aria-label=\"Legal\" style=\"display:flex;flex-wrap:wrap\"><a href=\"Open-Access.html\">Rights &amp; permissions<\/a><a href=\"Open-Access.html\">Copyright<\/a><a href=\"Publication-Ethics.html\">Publication ethics<\/a><a href=\"Contact.html\">Contact<\/a><\/nav>\n<p style=\"font-size:14px;color:#C9D3E3;margin-top:8px\">\u00a9 Daystar University 2026. Conceptual prototype: ISSN, DOI prefix, indexing status, licence, fees and review timelines are shown only once formally confirmed.<\/p>\n<\/div>\n<\/div>\n<\/footer>\n<\/div>\n\n\n<\/body>\n<\/html>\n", "Publication-Ethics": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>JAIDIS \u2014 Publication Ethics<\/title>\n\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n<style>\nbody{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#0F2A6B;background:#fff;line-height:1.55}\nh1,h2,h3,h4,p{margin:0}\na{color:#1565C0}a:hover{color:#0F2A6B}\n.wrap{max-width:1120px;margin:0 auto;padding:0 24px;box-sizing:border-box}\n.ser{font-family:'Source Serif 4',Georgia,serif}\n.nav a,.nav2 a{color:#0F2A6B;text-decoration:none;font-weight:500;font-size:15px;padding:12px 2px;border-bottom:3px solid transparent;display:inline-block;line-height:20px}\n.nav2 a{font-size:14px;color:#2A3750;padding:10px 2px}\n.nav a:hover,.nav2 a:hover{border-bottom-color:#1B7FE3;color:#0F2A6B}\n.nav a.on,.nav2 a.on{border-bottom-color:#1B7FE3;color:#0F2A6B}\n.ph{background:#FFF4D6;border:1px dashed #9A5217;color:#5C3410;padding:1px 7px;border-radius:3px;font-size:.92em}\n.card{border:1px solid #D8DDE6;border-radius:6px;ba bel=\"Primary\" style=\"display:flex;flex-wrap:wrap;gap:0 16px\">\n<a class=\"ml\" href=\"About.html\">About the journal<\/a>\n<a class=\"ml\" href=\"Author-Guidelines.html\">For authors<\/a>\n<a class=\"ml\" href=\"Publication-Ethics.html\">Policies<\/a>\n<a class=\"ml\" href=\"Contact.html\">Contact<\/a>\n<\/nav>\n<\/div>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px\">\n<div style=\"display:flex;align-items:center;gap:12px;color:#fff;font-size:15px;line-height:1.25\">\n<svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M3 9l9-5 9 5\"><\/path><path d=\"M5 10v8M9.5 10v8M14.5 10v8M19 10v8\"><\/path><path d=\"M3 20h18\"><\/path><\/svg>\n<span>Published under DRICE<br><strong>Daystar University<\/strong><\/span>\n<\/div>\n<a class=\"ml\" href=\"Archives.html\" style=\"gap:10px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M16.5 16.5L21 21\"><\/path><\/svg>Search<\/a>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wrap bc\"><a href=\"index.html\">Home<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> <a href=\"index.html\">JAIDIS<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> <a href=\"About.html\">Journal information<\/a> <span aria-hidden=\"true\" style=\"margin:0 10px;color:#6B7A93\">&gt;<\/span> Publication ethics<\/div>\n<section class=\"bn\">\n<svg viewBox=\"0 0 1240 330\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%\"><g fill=\"#fff\" fill-opacity=\".13\"><circle cx=\"40\" cy=\"40\" r=\"7\"><\/circle><circle cx=\"90\" cy=\"70\" r=\"5\"><\/circle><circle cx=\"140\" cy=\"40\" r=\"9\"><\/circle><circle cx=\"60\" cy=\"120\" r=\"5\"><\/circle><circle cx=\"110\" cy=\"150\" r=\"8\"><\/circle><circle cx=\"30\" cy=\"200\" r=\"6\"><\/circle><circle cx=\"170\" cy=\"100\" r=\"5\"><\/circle><circle cx=\"220\" cy=\"60\" r=\"7\"><\/circle><circle cx=\"1160\" cy=\"50\" r=\"8\"><\/circle><circle cx=\"1100\" cy=\"90\" r=\"6\"><\/circle><circle cx=\"1200\" cy=\"120\" r=\"7\"><\/circle><circle cx=\"1130\" cy=\"170\" r=\"5\"><\/circle><circle cx=\"1060\" cy=\"40\" r=\"5\"><\/circle><circle cx=\"1180\" cy=\"210\" r=\"8\"><\/circle><circle cx=\"980\" cy=\"60\" r=\"6\"><\/circle><circle cx=\"1020\" cy=\"130\" r=\"5\"><\/circle><\/g><circle cx=\"620\" cy=\"400\" r=\"260\" fill=\"#fff\" fill-opacity=\".05\"><\/circle><\/svg>\n<div class=\"wrap\" style=\"position:relative;padding-top:44px;padding-bottom:36px;display:flex;flex-direction:column;align-items:center;text-align:center\">\n<p style=\"font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#CFE3FB\">JAIDIS \u00b7 DRICE, Daystar University<\/p>\n<h2 class=\"ser\" style=\"font-size:40px;line-height:1.15;font-weight:700;margin-top:10px;color:#fff;max-width:900px\">Journal of Artificial Intelligence, Digital Innovation and Society<\/h2>\n<form aria-label=\"Search the journal\" class=\"srch\" style=\"display:flex;width:100%;max-width:700px;margin-top:28px\">\n<label for=\"bs\" style=\"position:absolute;left:-9999px\">Search JAIDIS<\/label>\n<input id=\"bs\" class=\"si\" type=\"search\" placeholder=\"Search JAIDIS\">\n<button type=\"button\" class=\"sb\" aria-label=\"Search\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M16.5 16.5L21 21\"><\/path><\/svg><\/button>\n<\/form>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:22px;justify-content:center\">\n<a class=\"bb bb1\" href=\"Author-Guidelines.html\">Submit manuscript<\/a>\n<a class=\"bb bb2\" href=\"Contact.html\">Announcements<\/a>\n<\/div>\n<\/div>\n<\/section>\n<div class=\"tabs\"><nav class=\"wrap\" aria-label=\"Journal sections\" style=\"display:flex;flex-wrap:wrap;padding-left:12px\"><a href=\"index.html\">Journal home<\/a><a href=\"About.html\" class=\"on\" aria-current=\"page\">Journal information<\/a><a href=\"Current-Issue.html\">Latest articles<\/a><a href=\"Archives.html\">All volumes<\/a><\/nav><\/div>\n<div class=\"gb\"><div class=\"wrap\" style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;padding-top:28px;padding-bottom:48px\"><nav class=\"sd\" aria-label=\"Journal information\"><a href=\"About.html\">About this journal<\/a><a href=\"Editorial-Board.html\" class=\"sub\">Editorial board<\/a><a href=\"Contact.html\" class=\"sub\">Contact details<\/a><a href=\"Author-Guidelines.html\">Author instructions<\/a><a href=\"Peer-Review.html\">Peer review information<\/a><div class=\"sh\" style=\"border-top:0\">Journal policies<\/div><a href=\"Publication-Ethics.html\" class=\"sub on\" aria-current=\"page\">Publication ethics<\/a><a href=\"Open-Access.html\" class=\"sub\">Open access and copyright<\/a><\/nav><main class=\"ct\"><div style=\"padding-bottom:28px;border-bottom:1px solid #E3E8EF\"><h1 class=\"pt\">Publication Ethics<\/h1>\n<p style=\"font-size:19px;color:#2A3750;margin-top:16px;max-width:720px\">The standards that authors, reviewers and editors are expected to meet, and what the journal does when something goes wrong.<\/p>\n<p style=\"margin-top:20px;font-size:14px;color:#44526A;max-width:720px\"><span class=\"ph\">Policy status: drafts, not yet approved<\/span> Each section lists what the policy will cover. The binding wording will be added only after formal approval by Daystar University.<\/p><\/div><div style=\"padding-top:8px\">\n\n<div style=\"flex:1 1 560px;min-width:0;max-width:800px\">\n\n<details class=\"pol\" id=\"integrity\" open=\"\"><summary><span>Research integrity<\/span><span class=\"stat\">Draft<\/span><\/summary>\n<div class=\"body\"><p>Authors report their methods, data and results honestly. Fabrication, falsification and selective reporting are not acceptable. Authors keep the underlying records and make them available to editors on request.<\/p><p><span class=\"ph\">[Approved policy wording \u2014 to be added]<\/span><\/p><\/div><\/details>\n\n<details class=\"pol\" id=\"plagiarism\"><summary><span>Plagiarism and text recycling<\/span><span class=\"stat\">Draft<\/span><\/summary>\n<div class=\"body\"><p>Manuscripts must be original and properly cite the work of others. The journal screens submissions for similarity to existing publications and treats undisclosed duplicate or redundant publication as a serious concern.<\/p><p><span class=\"ph\">[Screening tool and similarity threshold \u2014 to be decided]<\/span> <span class=\"ph\">[Approved policy wording \u2014 to be added]<\/span><\/p><\/div><\/details>\n\n<details class=\"pol\" id=\"coi\"><summary><span>Conflicts of interest<\/span><span class=\"stat\">Draft<\/span><\/summary>\n<div class=\"body\"><p>Authors, reviewers and editors declare financial, professional or personal relationships that could be seen to influence their work. Editors do not handle manuscripts where they have a conflict.<\/p><p><span class=\"ph\">[Disclosure form and procedure \u2014 to be added]<\/span><\/p><\/div><\/details>\n\n<details class=\"pol\" id=\"authorship\"><summary><span>Authorship and contributions<\/span><span class=\"stat\">Draft<\/span><\/summary>\n<div class=\"body\"><p>Authorship is reserved for those who made a substantial contribution and who approve the final manuscript. Contributions are stated. Changes to the author list after submission need the agreement of all authors.<\/p><p><span class=\"ph\">[Contribution taxonomy \u2014 to be selected]<\/span><\/p><\/div><\/details>\n\n<details class=\"pol\" id=\"ai\"><summary><span>Use of generative AI<\/span><span class=\"stat\">Draft<\/span><\/summary>\n<div class=\"body\"><p>As a journal about AI, JAIDIS expects openness about AI use. Authors, reviewers and editors disclose how generative AI tools were used, and remain fully responsible for the content. Confidential manuscripts are not uploaded to public AI tools.<\/p><p><span class=\"ph\">[Approved policy wording \u2014 to be added]<\/span><\/p><\/div><\/details>\n\n<details class=\"pol\" id=\"human\"><summary><span>Research with people, data and communities<\/span><span class=\"stat\">Draft<\/span><\/summary>\n<div class=\"body\"><p>Studies involving people, personal data or communities report ethics approval and informed consent, and respect privacy and local norms, including in African research settings.<\/p><p><span class=\"ph\">[Approving body and documentation required \u2014 to be added]<\/span><\/p><\/div><\/details>\n\n<details class=\"pol\" id=\"corrections\"><summary><span>Corrections, retractions and expressions of concern<\/span><span class=\"stat\">Draft<\/span><\/summary>\n<div class=\"body\"><p>Published articles that contain errors are corrected openly. Articles with serious problems are retracted, and an expression of concern may be issued while an investigation continues. Notices are linked to the original article and remain publicly visible.<\/p><p><span class=\"ph\">[Procedure and decision-makers \u2014 to be approved]<\/span><\/p><\/div><\/details>\n\n<details class=\"pol\" id=\"complaints\"><summary><span>Complaints and appeals<\/span><span class=\"stat\">Draft<\/span><\/summary>\n<div class=\"body\"><p>Concerns about a published article or about editorial conduct can be raised with the editorial office and are handled confidentially.<\/p><p>Contact: <a href=\"Contact.html\">editorial office<\/a>. <span class=\"ph\">[Complaints procedure \u2014 to be approved]<\/span><\/p><\/div><\/details>\n\n<p style=\"margin-top:32px;font-size:15px;color:#44526A\">Related: <a href=\"Peer-Review.html\">Peer Review<\/a> \u00b7 <a href=\"Open-Access.html\">Open Access and Copyright<\/a> \u00b7 <a href=\"Author-Guidelines.html\">Author Guidelines<\/a><\/p>\n<\/div><\/div><\/main><\/div><\/div>\n<footer>\n<div class=\"ft1\">\n<div class=\"wrap\" style=\"padding-top:44px;padding-bottom:36px\">\n<div style=\"background:#fff;display:inline-block;padding:10px 16px;border-radius:4px\"><img src=\"@@LOGO@@\" alt=\"Daystar University \u2014 DRICE\" style=\"height:56px;width:auto;display:block\"><\/div>\n<p class=\"ser\" style=\"margin-top:22px;font-size:22px;font-weight:700;color:#fff;max-width:640px;line-height:1.25\">Journal of Artificial Intelligence, Digital Innovation and Society<\/p>\n<p style=\"margin-top:8px;font-size:15px;max-width:640px\">JAIDIS is published under the Directorate of Research, Innovation, Commercialisation and Entrepreneurship (DRICE), Daystar University. Proposed web address: aipajournal.com<\/p>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px 40px;margin-top:36px\">\n<div><h2>This journal<\/h2><a class=\"fk\" href=\"About.html\">About this journal<\/a><a class=\"fk\" href=\"Editorial-Board.html\">Editorial board<\/a><a class=\"fk\" href=\"Contact.html\">Contact details<\/a><\/div>\n<div><h2>Read<\/h2><a class=\"fk\" href=\"Current-Issue.html\">Latest articles<\/a><a class=\"fk\" href=\"Archives.html\">All volumes<\/a><\/div>\n<div><h2>Authors<\/h2><a class=\"fk\" href=\"Author-Guidelines.html\">Author instructions<\/a><a class=\"fk\" href=\"Peer-Review.html\">Peer review information<\/a><\/div>\n<div><h2>Journal policies<\/h2><a class=\"fk\" href=\"Publication-Ethics.html\">Publication ethics<\/a><a class=\"fk\" href=\"Open-Access.html\">Open access and copyright<\/a><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"ft2\">\n<div class=\"wrap\" style=\"padding-top:14px;padding-bottom:18px\">\n<nav aria-label=\"Legal\" style=\"display:flex;flex-wrap:wrap\"><a href=\"Open-Access.html\">Rights &amp; permissions<\/a><a href=\"Open-Access.html\">Copyright<\/a><a href=\"Publication-Ethics.html\">Publication ethics<\/a><a href=\"Contact.html\">Contact<\/a><\/nav>\n<p style=\"fo ities that are often separated, and welcomes work grounded in real-world contexts, including Africa. Every submission should clearly fit the journal\u2019s scope.<\/p>\n<p style=\"margin-top:18px\"><a href=\"About.html\" style=\"font-weight:600\">Read the aims and scope \u2192<\/a><\/p>\n<\/div><\/div>\n<section style=\"padding-top:36px;padding-bottom:36px;border-bottom:1px solid #E3E8EF\">\n<h2 style=\"font-size:20px;font-weight:500;color:#44526A\">Areas of interest<\/h2>\n<div style=\"display:flex;justify-content:center;margin-top:18px\"><svg viewBox=\"0 0 600 420\" width=\"600\" style=\"max-width:100%;height:auto\" role=\"img\" aria-label=\"The three areas of interest of JAIDIS: Artificial Intelligence, Digital Innovation and Society\"><polygon transform=\"translate(180,0)\" points=\"60,0 180,0 240,104 180,208 60,208 0,104\" fill=\"#D6E8FB\" stroke=\"#1B7FE3\" stroke-width=\"1.5\"><\/polygon><polygon transform=\"translate(0,104)\" points=\"60,0 180,0 240,104 180,208 60,208 0,104\" fill=\"#D3EFEC\" stroke=\"#0B7A75\" stroke-width=\"1.5\"><\/polygon><polygon transform=\"translate(360,104)\" points=\"60,0 180,0 240,104 180,208 60,208 0,104\" fill=\"#E2E3FA\" stroke=\"#4B4FC4\" stroke-width=\"1.5\"><\/polygon><polygon transform=\"translate(180,208)\" points=\"60,0 180,0 240,104 180,208 60,208 0,104\" fill=\"#FFFFFF\" stroke=\"#C9D3E3\" stroke-width=\"1.5\"><\/polygon><text x=\"300\" y=\"71\" font-size=\"19\" font-weight=\"700\" fill=\"#0F2A6B\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\">Artificial<\/text><text x=\"300\" y=\"93\" font-size=\"19\" font-weight=\"700\" fill=\"#0F2A6B\" text-anchor=\"middle\" font-family=\"Source Serif 4, Georgia, serif\">Intelligence<\/text><text x=\"300\" y=\"121\" font-size=\"12\" fill=\"#2A3750\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, system-ui, sans-serif\">Machine learning,<\/text><text x=\"300\" y=\"136\" font-size=\"12\" fill=\"#2A3750\" text-anchor=\"middle\" font-family=\"IBM Plex Sans, sy
